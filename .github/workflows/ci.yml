name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [18, 20, 22]
        include:
          # The project was developed on Windows only; keep that environment honest.
          - os: windows-latest
            node: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # --frozen-lockfile is the check, not an optimization: it fails when
      # pnpm-lock.yaml has drifted from the package manifests.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Build comes first because it is a prerequisite, not a final gate: each
      # package resolves its @filterbridge/* siblings through their dist/
      # output, which a fresh checkout does not have (dist/ is gitignored).
      # Without it, `pnpm typecheck` fails with TS2307 and `pnpm test` cannot
      # resolve the cross-package imports. Typechecking after the build has the
      # side benefit of validating the emitted .d.ts/.d.cts, which is part of
      # the published contract and no test covers.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  demo:
    name: demo build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The demo resolves @filterbridge/* through each package's dist/ output,
      # so the packages have to be built first.
      - name: Build packages
        run: pnpm build

      - name: Build demo
        run: pnpm demo:build

  changeset:
    name: changeset
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fails when packages/** changed without a changeset. For changes that
      # need no release, run `pnpm changeset add --empty`.
      - name: Verify changeset
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
